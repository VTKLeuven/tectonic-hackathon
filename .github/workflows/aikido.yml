name: Aikido Security

# Aikido's official CI action. It scans a pull request for new issues
# compared to its base branch, so it runs on pull requests (and by hand).
# The full AI Code Audit for the hackathon runs on app.aikido.dev with this
# repository connected.
#
# Needs the repository secret AIKIDO_SECRET_KEY, created in Aikido under
# Settings > Integrations > CI. Without it the job is skipped instead of failing.

on:
  pull_request:
    branches: ['*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aikido-security:
    name: Aikido security scan
    runs-on: ubuntu-latest
    env:
      HAS_AIKIDO_KEY: ${{ secrets.AIKIDO_SECRET_KEY != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Missing Aikido key
        if: env.HAS_AIKIDO_KEY != 'true'
        run: echo "::notice::AIKIDO_SECRET_KEY is not set; skipping the Aikido scan."

      - name: Detect new vulnerabilities
        if: env.HAS_AIKIDO_KEY == 'true'
        uses: AikidoSec/github-actions-workflow@v1.0.13
        with:
          secret-key: ${{ secrets.AIKIDO_SECRET_KEY }}
          fail-on-timeout: true
          fail-on-dependency-scan: true
          fail-on-sast-scan: false
          fail-on-iac-scan: false
          minimum-severity: 'HIGH'
          timeout-seconds: 180
          post-scan-status-comment: 'off'
          post-sast-review-comments: 'off'
